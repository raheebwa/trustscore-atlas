name: activity
version: 1
title: Activity
question: Is there recent evidence of operation?
max: 100
licence: CC-BY-4.0
predicates:
  - id: recent_statement
    points: 40
    description: Any register statement with a source-side date within the last 12 months.
    window_months: 12
  - id: valid_licence_or_permit
    points: 30
    description: A licence or permit with an expiry date in the future.
  - id: public_contract_awarded
    points: 20
    description: A public contract award within the last 24 months.
    window_months: 24
  - id: seen_in_multiple_registers
    points: 10
    description: Found in at least two independent registers.
