# SPDX-License-Identifier: Apache-2.0
# Uganda country pack. The canonical layer, score engine and surfaces are pack-agnostic;
# everything Uganda-specific is declared here or under this directory.
country: UG
name: Uganda
currency: UGX
languages: [en]
timezone: Africa/Kampala

# Identifier schemes emitted by this pack's adapters. Codes follow org-id.guide where a
# scheme exists there (UG-RSB for URSB); the rest are proposed upstream, not invented privately.
identifier_schemes:
  ug:tin:
    title: Uganda Revenue Authority tax identification number
    issuer: Uganda Revenue Authority
    pattern: "^1[0-9]{9}$"
    issuer_unique: true   # one TIN, one taxpayer: an exact match groups records across registers
    org_id_guide: null
  ug:kcca_licence:
    title: KCCA licensed business row key
    issuer: Kampala Capital City Authority
    pattern: "^[0-9a-f]{16}$"
    org_id_guide: null
    synthetic: true   # our key for the published row, not a number KCCA issued: never shown as an identifier
    note: KCCA publishes no licence number; the key is a deterministic hash of the published row.
  ug:customs_licence:
    title: Uganda Revenue Authority customs agent licence number
    issuer: Uganda Revenue Authority
    pattern: "^[A-Za-z0-9][A-Za-z0-9./-]*$"
    org_id_guide: null
    note: The issuing tax office determines the format; observed values use letters, digits, slashes, dots and hyphens.
  ug:ppda_party_id:
    title: PPDA OCDS party identifier
    issuer: Public Procurement and Disposal of Public Assets Authority
    pattern: "^[A-Za-z0-9_.:-]+$"
    org_id_guide: null
  ug:unbs_permit:
    title: UNBS product certification permit number
    issuer: Uganda National Bureau of Standards
    pattern: "^[A-Za-z0-9/-]+$"
    org_id_guide: null
  ug:bou_code:
    title: Bank of Uganda supervised institution code
    issuer: Bank of Uganda
    # Bank SWIFT-style codes, forex bureau (FXB) and money remitter (MR) licence references
    # (with optional branch suffixes), credit reference bureaus, and the register's own
    # four-digit codes. Free text such as an expiry note is not a code and is not emitted.
    pattern: "^(?:(?:SC: )?[A-Z]{4}UG[A-Z0-9]{2}(?:[A-Z0-9]{3})?|FXB ?[0-9]{2,3}|MR [0-9]{2,3}(?: ?\\([a-z]\\))?(?:/MR [0-9]{2,3} ?\\([a-z]\\))?|CRB[0-9]{3,4}|[0-9]{4})$"
    # What the register prints in the code column when it has no code. These match the pattern
    # above but identify nothing, and publishing them would offer a reader a number to quote back.
    null_values: ["0000", "0", "N/A", "n/a", "-", "--", "TBA"]
    org_id_guide: null
  ug:nlgrb_licence:
    title: NLGRB gaming operator licence number
    issuer: National Lotteries and Gaming Regulatory Board
    pattern: "^NLGRB-[A-Z]{2,5}-[0-9]{2}-[0-9]{4}$"
    org_id_guide: null
  ug:ursb_reg_no:
    title: URSB registration number
    issuer: Uganda Registration Services Bureau
    pattern: "^[0-9]+$"
    org_id_guide: UG-RSB

# Precedence bindings: which rank each source class takes in this pack (see docs/adrs/0001).
precedence:
  operator_verified: 1
  register_of_record: 2
  regulator_or_authority: 3
  derived: 4
  inferred: 5

# Administrative boundaries used for location tagging and the explorer map.
boundaries:
  provider: HDX COD-AB (UBOS)
  licence: CC-BY-IGO
  levels: [adm1, adm2, adm3, adm4]
  # The map the explorer draws for this pack. A pack without this key shows its bar lists and
  # says it has no map yet, rather than borrowing another country's outline.
  map:
    level: adm2
    asset: ug-adm2.topojson
    object: adm2
    attribution: OCHA common operational datasets for Uganda (COD-AB), CC BY-IGO, simplified.
  # The capital's licensing divisions; a business licensed in one of them is in Kampala district.
  kcca_divisions: [Central Division, Kawempe Division, Makindye Division, Nakawa Division, Rubaga Division]

# Every register in the Phase 0 universe, with its load state. Coverage counts only sources in
# state loaded that have an accepted run; not_loaded sources are 'not yet checked', never 'checked'.
sources:
  - slug: kcca.businesses
    state: loaded
  - slug: kcca.property_rates
    state: not_loaded
    publisher: Kampala Capital City Authority
    title: Property rates compliance roster
    url: https://www.kcca.go.ug/
    cadence: annual
    licence: public-record
  - slug: ura.vat_withholding_agents
    state: loaded
  - slug: ura.customs_agents
    state: loaded
  - slug: ura.wht_exemptions
    state: loaded
  - slug: ppda.ocds
    state: loaded
  - slug: unbs.certified_products
    state: loaded
  - slug: bou.supervised_institutions
    state: loaded
  - slug: cma.licensed_firms
    state: not_loaded
    publisher: Capital Markets Authority
    title: Licensed firms register
    url: https://cmauganda.co.ug/
    cadence: quarterly
    licence: public-record
  - slug: urbra.licensed_schemes
    state: not_loaded
    publisher: Uganda Retirement Benefits Regulatory Authority
    title: Licensed schemes and service providers
    url: https://urbra.go.ug/
    cadence: quarterly
    licence: public-record
  - slug: ucc.broadcasters
    state: not_loaded
    publisher: Uganda Communications Commission
    title: Licensed broadcasters
    url: https://www.ucc.co.ug/
    cadence: quarterly
    licence: public-record
  - slug: nlgrb.gaming_operators
    state: loaded
