# Table schema for records.parquet after applying the adapter posture.
fields:
  - name: record_id
    type: string
    description: Deterministic key of one institution row.
    constraints: { required: true, pattern: "^[0-9a-f]{16}$" }
  - name: name
    type: string
    description: Name published by the Central Bank of Kenya.
    constraints: { required: true }
  - name: category
    type: string
    description: Institution category parsed from the directory section heading.
    constraints:
      required: true
      pattern: "^(commercial_bank|mortgage_finance_institution|bank_holding_company|microfinance_bank)$"
  - name: website
    type: string
    description: Institution website published in the directory, when present.
  - name: date_licensed
    type: string
    description: Raw licensed or authorised date text published in the directory, when present.
  - name: peer_group
    type: string
    description: Peer group published in the directory, when present.
  - name: branches
    type: string
    description: Raw branch count text published in the directory, when present.
  - name: directory_edition
    type: string
    description: Year and month of the selected directory PDF upload.
    constraints: { required: true, pattern: "^[0-9]{4}/[0-9]{2}$" }
  - name: source_ref
    type: string
    description: The selected directory PDF URL from which the row was parsed.
    constraints: { required: true }
