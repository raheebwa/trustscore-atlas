<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			The two faces every page paints first: the body text and the display face at the weight
			headings actually inherit. Preloading a weight nothing on the page uses costs a request
			and warns in the console, so these must stay the faces that paint.
		-->
		<link
			rel="preload"
			href="/fonts/inter-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/newsreader-latin-500-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
