# SPDX-License-Identifier: Apache-2.0
name: Roll back serving data

on:
  workflow_dispatch:
    inputs:
      regeneration_id:
        description: Regeneration ID to restore
        required: true
        type: string
      request_id:
        description: Optional maintainer rollback request ID
        required: false
        type: string
      smoke:
        description: Install the toolchain and stop, to prove a toolchain change without touching data
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare rollback paths
        id: rollback
        env:
          REGENERATION_ID: ${{ inputs.regeneration_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          mkdir -p data/rollback
          : >data/rollback/load-d1.log
          if [[ ! $REGENERATION_ID =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "invalid regeneration id" >&2
            exit 1
          fi
          if [[ -n $REQUEST_ID ]] && [[ ! $REQUEST_ID =~ ^[A-Za-z0-9_-]{1,200}$ ]]; then
            echo "invalid regeneration request id" >&2
            exit 1
          fi
          sql_dir="$RUNNER_TEMP/atlas-rollback-$GITHUB_RUN_ID"
          mkdir -p "$sql_dir"
          printf 'sql_dir=%s\n' "$sql_dir" >>"$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install Python and pipeline dependencies
        working-directory: pipeline
        run: |
          set -euo pipefail
          uv python install 3.13
          uv sync

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          # The version comes from packageManager in the root package.json. Naming it here as
          # well makes the action refuse to install at all, which is how the data workflows
          # broke the moment that field arrived.
          run_install: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Secrets are passed only through step environments. Steps must not print the environment or enable xtrace.
      - name: Mark rollback request running
        if: ${{ !inputs.smoke && inputs.request_id != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUEST_ID: ${{ inputs.request_id }}
          REGENERATION_ID: ${{ inputs.regeneration_id }}
        run: |
          set -euo pipefail
          pipeline/.venv/bin/python -m atlas_pipeline requests mark \
            --request-id "$REQUEST_ID" --status running \
            --note "rollback to $REGENERATION_ID started"

      - name: Guard retained regeneration
        if: ${{ !inputs.smoke }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGENERATION_ID: ${{ inputs.regeneration_id }}
        run: |
          set -euo pipefail
          guard_dir="$RUNNER_TEMP/atlas-rollback-guard-$GITHUB_RUN_ID"
          mkdir -p "$guard_dir"
          (cd app && pnpm exec wrangler r2 object get \
            "atlas-data/regen/$REGENERATION_ID/swap.sql" \
            --file "$guard_dir/swap.sql" --remote)
          (cd app && pnpm exec wrangler r2 object get \
            "atlas-data/bundles/$REGENERATION_ID/manifest.json" \
            --file "$guard_dir/manifest.json" --remote)
          pipeline/.venv/bin/python - "$guard_dir/manifest.json" "$REGENERATION_ID" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if manifest.get("regeneration_id") != sys.argv[2]:
              raise ValueError("bundle manifest regeneration id mismatch")
          PY

      - name: Download regeneration SQL
        if: ${{ !inputs.smoke }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGENERATION_ID: ${{ inputs.regeneration_id }}
          SQL_DIR: ${{ steps.rollback.outputs.sql_dir }}
        run: |
          set -euo pipefail
          sql_files=(
            prelude.sql stage.sql swap.sql
            statements-prelude.sql statements-stage.sql statements-swap.sql
            scores-prelude.sql scores-stage.sql scores-swap.sql
          )
          for sql_file in "${sql_files[@]}"; do
            (cd app && pnpm exec wrangler r2 object get \
              "atlas-data/regen/$REGENERATION_ID/$sql_file" \
              --file "$SQL_DIR/$sql_file" --remote)
          done

      - name: Verify retained SQL against the index
        if: ${{ !inputs.smoke }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGENERATION_ID: ${{ inputs.regeneration_id }}
          SQL_DIR: ${{ steps.rollback.outputs.sql_dir }}
        run: |
          set -euo pipefail
          (cd app && pnpm exec wrangler r2 object get "atlas-data/regen/index.json" \
            --file "$RUNNER_TEMP/regen-index.json" --remote)
          pipeline/.venv/bin/python -m atlas_pipeline regen verify \
            --dir "$SQL_DIR" --index "$RUNNER_TEMP/regen-index.json" \
            --regeneration "$REGENERATION_ID" | tee data/rollback/verify.json

      - name: Compare the target bundle with the live bundle
        if: ${{ !inputs.smoke }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGENERATION_ID: ${{ inputs.regeneration_id }}
        run: |
          set -euo pipefail
          get_object() {
            mkdir -p "$(dirname "$2")"
            (cd app && pnpm exec wrangler r2 object get "$1" --file "$2" --remote)
          }
          get_object "atlas-data/bundles/latest.json" "$RUNNER_TEMP/latest.json"
          live_id=$(pipeline/.venv/bin/python -c \
            'import json, re, sys; v = json.load(open(sys.argv[1]))["regeneration_id"]; assert re.fullmatch(r"[0-9]{8}T[0-9]{6}Z", v); print(v)' \
            "$RUNNER_TEMP/latest.json")
          for pair in "$live_id:live" "$REGENERATION_ID:target"; do
            id=${pair%%:*}; role=${pair##*:}
            # The business list decides the comparison, so a failed download is a failed step,
            # never an empty directory the guard would read as a clean result.
            get_object "atlas-data/bundles/$id/canonical/businesses.parquet" \
              "$RUNNER_TEMP/bundles/$role/canonical/businesses.parquet"
            for name in canonical/aliases.parquet canonical/labels.jsonl \
              canonical/operator_statements.jsonl; do
              get_object "atlas-data/bundles/$id/$name" "$RUNNER_TEMP/bundles/$role/$name" || true
            done
          done
          pipeline/.venv/bin/python -m atlas_pipeline guard \
            --target-bundle "$RUNNER_TEMP/bundles/target" --live-bundle "$RUNNER_TEMP/bundles/live" \
            --out data/rollback/guard.json

      - name: Load retained regeneration
        if: ${{ !inputs.smoke }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SQL_DIR: ${{ steps.rollback.outputs.sql_dir }}
        run: |
          set -euo pipefail
          infra/scripts/load-d1.sh "$SQL_DIR" 2>&1 | tee data/rollback/load-d1.log

      - name: Move latest bundle pointer
        if: ${{ !inputs.smoke }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGENERATION_ID: ${{ inputs.regeneration_id }}
        run: |
          set -euo pipefail
          latest_file="$RUNNER_TEMP/atlas-rollback-latest-$GITHUB_RUN_ID.json"
          pipeline/.venv/bin/python - "$latest_file" "$REGENERATION_ID" <<'PY'
          import datetime
          import json
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "regeneration_id": sys.argv[2],
                      "uploaded_at": datetime.datetime.now(datetime.UTC).strftime(
                          "%Y-%m-%dT%H:%M:%SZ"
                      ),
                  },
                  separators=(",", ":"),
              )
              + "\n"
          )
          PY
          (cd app && pnpm exec wrangler r2 object put "atlas-data/bundles/latest.json" \
            --file "$latest_file" --content-type application/json --remote)

      - name: Mark rollback request done
        if: ${{ !inputs.smoke && success() && inputs.request_id != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUEST_ID: ${{ inputs.request_id }}
          REGENERATION_ID: ${{ inputs.regeneration_id }}
        run: |
          set -euo pipefail
          pipeline/.venv/bin/python -m atlas_pipeline requests mark \
            --request-id "$REQUEST_ID" --status "done" \
            --note "rollback to $REGENERATION_ID completed"

      - name: Mark rollback request failed
        if: ${{ !inputs.smoke && failure() && inputs.request_id != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUEST_ID: ${{ inputs.request_id }}
          REGENERATION_ID: ${{ inputs.regeneration_id }}
        run: |
          set -euo pipefail
          pipeline/.venv/bin/python -m atlas_pipeline requests mark \
            --request-id "$REQUEST_ID" --status "failed" \
            --note "rollback to $REGENERATION_ID failed in run $GITHUB_RUN_ID"

      - name: Upload rollback load log
        if: ${{ !inputs.smoke && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-load-log-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/rollback/load-d1.log
            data/rollback/verify.json
            data/rollback/guard.json
