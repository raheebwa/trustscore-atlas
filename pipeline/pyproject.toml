[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "Ingestion, resolution, scoring and loading framework for TrustScore Atlas"
readme = "README.md"
authors = [
    { name = "Aheebwa Ramadhan", email = "raaheebwa@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pdfplumber",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "splink>=4.0.16",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=atlas_pipeline --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
